<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel — DeutschBlog</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Keep ALL your existing styles */
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#C0392B;--dark:#111;--mid:#555;--bg:#F8F6F2;--white:#fff;--border:#E5E0D8}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--white);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--dark);text-decoration:none}
.logo span{color:var(--red)}
nav a{text-decoration:none;color:var(--mid);font-size:13px;font-weight:500;padding:6px 14px;border-radius:4px;margin-left:4px;transition:all 0.2s}
nav a:hover{background:var(--red);color:#fff}
.post-hero{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;padding:60px 24px 50px;text-align:center}
.post-cat{display:inline-block;background:var(--red);font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:4px 14px;margin-bottom:20px;font-weight:600}
.post-title{font-family:'Playfair Display',serif;font-size:48px;font-weight:900;line-height:1.15;letter-spacing:-1.5px;max-width:800px;margin:0 auto 20px}
.post-meta{font-size:13px;color:rgba(255,255,255,0.6);letter-spacing:0.5px}
.post-meta span{color:rgba(255,255,255,0.9);font-weight:500}
.container{max-width:760px;margin:60px auto;padding:0 24px 80px}
.article-body{font-size:18px;line-height:1.9;color:#333;font-weight:300}
.article-body p{margin-bottom:26px}
.article-body h2{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--dark);margin:48px 0 18px;letter-spacing:-0.5px}
.article-body h3{font-size:20px;font-weight:600;color:var(--dark);margin:32px 0 12px}
.article-body a{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.article-body ul,.article-body ol{padding-left:24px;margin-bottom:24px}
.article-body li{margin-bottom:8px;line-height:1.7}
blockquote{border-left:4px solid var(--red);padding:20px 28px;margin:36px 0;background:var(--white);font-style:italic;font-size:20px;color:var(--mid)}
.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--mid);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:40px;padding:8px 0;border-bottom:1px solid var(--border)}
.back-btn:hover{color:var(--red)}
footer{background:var(--dark);color:#666;text-align:center;padding:40px 24px}
.footer-logo{font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:12px}
.footer-logo span{color:var(--red)}
footer p{font-size:13px}
footer a{color:#888;text-decoration:none}
.not-found{text-align:center;padding:100px 24px;color:var(--mid)}
.not-found h2{font-family:'Playfair Display',serif;font-size:36px;color:var(--dark);margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">Deutsch<span>Blog</span></a>
    <nav>
      <a href="index.html">← Zurück</a>
      <a href="index.html">Startseite</a>
    </nav>
  </div>
</header>

<div id="post-hero" class="post-hero" style="display:none">
  <div class="post-cat" id="post-cat">Deutschland</div>
  <h1 class="post-title" id="post-title"></h1>
  <div class="post-meta">Von <span id="post-author">Redaktion</span> &nbsp;·&nbsp; <span id="post-date"></span> &nbsp;·&nbsp; <span id="post-read">5 Min. Lesezeit</span></div>
</div>

<div class="container">
  <a href="index.html" class="back-btn">← Alle Artikel</a>
  <div id="article-body" class="article-body"></div>
  <div id="not-found" class="not-found" style="display:none">
    <h2>Artikel nicht gefunden</h2>
    <p>Der gesuchte Artikel existiert nicht.</p>
  </div>
</div>

<footer>
  <div class="footer-logo">Deutsch<span>Blog</span></div>
  <p>&copy; 2026 DeutschBlog &nbsp;·&nbsp; <a href="#">Impressum</a> &nbsp;·&nbsp; <a href="#">Datenschutz</a></p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const SITE_NAME = 'deutschblog';

async function loadPost() {
  try {
    // Get Gist ID from localStorage (set by admin)
    const saved = localStorage.getItem('gist_config_deutsch');
    let gistId = '';
    if (saved) {
      const config = JSON.parse(saved);
      gistId = config.gistId;
    }
    
    if (!gistId) {
      console.log('No Gist ID found');
      document.getElementById('not-found').style.display = 'block';
      return;
    }
    
    console.log('Fetching post from Gist ID:', gistId);
    
    // Use raw URL
    const rawUrl = `https://gist.githubusercontent.com/Hamzamain-spec/${gistId}/raw/posts.json`;
    const response = await fetch(rawUrl);
    
    if (response.ok) {
      const allPosts = await response.json();
      console.log('All posts:', allPosts);
      
      // Filter by site name
      const sitePosts = allPosts.filter(post => post.site === SITE_NAME);
      console.log(`Found ${sitePosts.length} posts for site`);
      
      const post = sitePosts.find(p => p.id == id);
      console.log('Looking for ID:', id);
      console.log('Found post:', post);
      
      if (post) {
        document.title = post.title + ' — DeutschBlog';
        document.getElementById('post-title').textContent = post.title;
        document.getElementById('post-cat').textContent = post.category || 'Deutschland';
        document.getElementById('post-author').textContent = post.author || 'Redaktion';
        document.getElementById('post-date').textContent = new Date(post.date).toLocaleDateString('de-DE', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        
        const words = post.content.replace(/<[^>]+>/g, '').split(' ').length;
        document.getElementById('post-read').textContent = Math.max(1, Math.round(words / 200)) + ' Min. Lesezeit';
        
        document.getElementById('article-body').innerHTML = post.content;
        document.getElementById('post-hero').style.display = 'block';
      } else {
        console.log('Post not found');
        document.getElementById('not-found').style.display = 'block';
      }
    } else {
      console.error('Failed to fetch from Gist:', response.status);
      document.getElementById('not-found').style.display = 'block';
    }
  } catch (error) {
    console.error('Error loading post:', error);
    document.getElementById('not-found').style.display = 'block';
  }
}

loadPost();
</script>
</body>
</html>
